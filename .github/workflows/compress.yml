name: Compress system.img

on:
  workflow_dispatch:

jobs:
  compress:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Download system.img
        run: |
          pip install -U yt-dlp gdown
          mkdir dl
          if yt-dlp -P dl -o "%(title)s.%(ext)s" "https://gofile.io/d/06fn5ZVb"; then
            F=$(ls -S dl/* | head -n1)
            mv "$F" system.img
          else
            gdown "1Njv0F7aWJaPPcn47bUIFeI2vXi03wJtr" -O system.img
          fi
          ls -lh system.img

      - name: Compress
        run: |
          xz -9e -T0 -k -v system.img
          ls -lh system.img.xz

      - name: Upload to Gofile
        run: |
          RESP=$(curl -s -F "file=@system.img.xz" https://upload.gofile.io/uploadfile)
          echo "$RESP"
          LINK=$(echo "$RESP" | jq -r .data.downloadPage)
          echo "Gofile link: $LINK"
          echo "### Gofile link: $LINK" >> $GITHUB_STEP_SUMMARY
