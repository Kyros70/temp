name: M5A dump + device tree

on:
  workflow_dispatch:

env:
  FILE_ID: 1Zym11jucMp-BnYvk9qhpChoPkVqmIae7
  GH_TOKEN: ${{ secrets.PAT }}

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip zip p7zip-full lz4 android-sdk-libsparse-utils
          pip install gdown
          git clone --depth=1 https://github.com/AndroidDumps/dumpyara
          (cd dumpyara && bash setup.sh)
          pip install aospdtgen
          git clone --depth=1 https://github.com/bismoy-bot/PAC-Extractor

      - name: Download stock zip (gdown, by ID)
        run: gdown "$FILE_ID" -O stock.zip

      - name: Unzip and extract PAC
        run: |
          mkdir -p zipout pacout
          unzip -o stock.zip -d zipout
          PAC=$(find zipout -iname '*.pac' | head -n1)
          echo "PAC: $PAC"
          python3 PAC-Extractor/extractor.py "$PAC" pacout
          ls -lah pacout
          rm -rf stock.zip zipout

      - name: Dump with dumpyara (handles super.img)
        run: |
          (cd pacout && zip -0 -r ../firmware.zip .)
          rm -rf pacout
          cd dumpyara
          bash dumpyara.sh "$GITHUB_WORKSPACE/firmware.zip"
          # locate the dump dir (the one containing system/)
          DUMP=$(find working -maxdepth 3 -type d -name system -printf '%h\n' | awk '{print length, $0}' | sort -n | head -n1 | cut -d' ' -f2-)
          echo "DUMP=$PWD/$DUMP" | tee -a "$GITHUB_ENV"
          ls "$DUMP"

      - name: Generate device tree with aospdtgen
        run: |
          python3 -m aospdtgen "$DUMP" -o dt_output
          find dt_output -maxdepth 3

      - name: Push device tree to a new repo
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          cd dt_output
          git init -b main
          git add -A
          git commit -qm "M5A device tree"
          gh repo create "${{ github.repository_owner }}/m5a-device-tree" --public --source=. --push
          
