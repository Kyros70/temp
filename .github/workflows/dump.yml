name: M5A dump + device tree

on:
  workflow_dispatch:

env:
  FILE_ID: 1Zym11jucMp-BnYvk9qhpChoPkVqmIae7

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip zip p7zip-full lz4 android-sdk-libsparse-utils
          pip install gdown aospdtgen
          git clone --depth=1 https://github.com/AndroidDumps/dumpyara
          (cd dumpyara && bash setup.sh)
          git clone --depth=1 https://github.com/bismoy-bot/PAC-Extractor

      - name: Download stock zip
        run: gdown "$FILE_ID" -O stock.zip

      - name: Extract PAC
        run: |
          mkdir -p zipout pacout
          unzip -o stock.zip -d zipout
          PAC=$(find zipout -iname '*.pac' | head -n1)
          python3 PAC-Extractor/extractor.py "$PAC" pacout
          rm -rf stock.zip zipout
          find pacout -type f | head -50

      - name: Keep boot images aside
        run: |
          mkdir bootimgs
          find pacout -type f \( -name 'boot*.img' -o -name 'vendor_boot*.img' -o -name 'init_boot*.img' -o -name 'dtbo*.img' \) -exec cp -v {} bootimgs/ \;
          ls -lah bootimgs

      - name: Run dumpyara
        run: |
          (cd pacout && zip -0 -r ../firmware.zip .)
          rm -rf pacout
          cd dumpyara
          bash dumpyara.sh "$GITHUB_WORKSPACE/firmware.zip" || true

      - name: Find dump folder and add boot images
        run: |
          cd dumpyara
          D=$(find working -maxdepth 3 -type d -name system -printf '%h\n' | awk '{print length, $0}' | sort -n | head -n1 | cut -d' ' -f2-)
          cp -vn "$GITHUB_WORKSPACE"/bootimgs/*.img "$D"/
          echo "DUMP=$PWD/$D" >> "$GITHUB_ENV"
          ls -lah "$D"

      - name: Generate device tree
        run: |
          python3 -m aospdtgen "$DUMP" -o dt_output
          find dt_output -maxdepth 3

      - name: Push device tree
        run: |
          git config --global user.name "Kyros70"
          git config --global user.email "218506751+Kyros70@users.noreply.github.com"
          cd dt_output
          git init -b main
          git add -A
          git commit -qm "M5A device tree"
          git remote add origin https://x-access-token:${{ secrets.PAT }}@github.com/Kyros70/m5a-aospdtgen.git
          git push -u origin main --force
